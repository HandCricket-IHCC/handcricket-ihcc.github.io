<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>IHCC Election</title>
<style>
  :root {
    --bg:#f3f6f4; --card:#ffffff; --fg:#10201a; --muted:#41524a; --line:#cfd8d3;
    --brand:#0b5d3b; --brand-fg:#ffffff; --brand-soft:#e3f2ea; --accent:#b8860b;
    --warn:#8a1c00; --warn-soft:#fdeae4; --ok:#0b5d3b;
    --testbg:#fff3b0; --testfg:#3b2f00; --focus:#ff9f0a; --shadow:0 1px 3px rgba(16,32,26,.12), 0 6px 18px rgba(16,32,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1512; --card:#15201b; --fg:#f1f6f3; --muted:#b4c3bb; --line:#2f4038;
      --brand:#5fd49b; --brand-fg:#06210f; --brand-soft:#17332a; --accent:#e5b93c;
      --warn:#ff9d85; --warn-soft:#3a1a13; --ok:#5fd49b;
      --testbg:#4a3d00; --testfg:#fff3b0; --focus:#ffb84d; --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .skip { position:absolute; left:-999px; top:0; background:var(--brand); color:var(--brand-fg); padding:12px 18px; z-index:10; border-radius:0 0 8px 0; }
  .skip:focus { left:0; }
  #testbar { background:var(--testbg); color:var(--testfg); padding:12px 16px; font-weight:700; text-align:center; border-bottom:3px solid var(--testfg); }
  header.top { background:var(--brand); color:var(--brand-fg); padding:22px 16px 26px; }
  header.top .in { max-width:760px; margin:0 auto; }
  header.top .org { font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; opacity:.9; margin:0 0 4px; }
  header.top h1 { font-size:1.9rem; line-height:1.2; margin:0; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 40px; }
  h2 { font-size:1.3rem; line-height:1.3; margin:0 0 .4rem; }
  p { margin:.4rem 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px; margin:16px 0; box-shadow:var(--shadow); }
  .card.done { border-color:var(--ok); border-width:2px; background:var(--brand-soft); }
  .card.bad { border-color:var(--warn); background:var(--warn-soft); }
  .muted { color:var(--muted); }
  .small { font-size:.92rem; }
  #msg { margin:16px 0; padding:14px 16px; border-left:6px solid var(--brand); background:var(--card); border-radius:10px; box-shadow:var(--shadow); font-weight:600; min-height:1.6em; }
  #msg.err { border-left-color:var(--warn); color:var(--warn); background:var(--warn-soft); }
  #msg:focus { outline:3px solid var(--focus); outline-offset:2px; }
  button { font:inherit; font-weight:700; min-height:52px; padding:12px 20px; margin:6px 8px 6px 0; border:2px solid var(--brand); background:var(--brand); color:var(--brand-fg); border-radius:12px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--fg); border-color:var(--line); font-weight:600; }
  button:active { transform:translateY(1px); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:4px solid var(--focus); outline-offset:3px; }
  dl.who { margin:.6rem 0 0; display:grid; grid-template-columns:1fr; gap:6px; }
  dl.who div { padding:10px 12px; background:var(--bg); border-radius:10px; }
  dl.who dt { font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  dl.who dd { margin:0; font-weight:700; word-break:break-word; }
  @media (min-width:560px) { dl.who { grid-template-columns:1fr 1fr; } }
  .progress { height:12px; border-radius:999px; background:var(--line); overflow:hidden; margin:10px 0 4px; }
  .progress > span { display:block; height:100%; background:var(--brand); transition:width .4s ease; }
  .seat h2 { display:flex; align-items:center; gap:10px; }
  .seat .num { flex:none; width:34px; height:34px; border-radius:50%; background:var(--brand); color:var(--brand-fg); display:inline-flex; align-items:center; justify-content:center; font-size:1rem; font-weight:800; }
  .badge { display:inline-block; padding:3px 12px; border-radius:999px; font-size:.85rem; font-weight:800; background:var(--ok); color:var(--brand-fg); margin-left:auto; }
  .badge.wait { background:transparent; color:var(--muted); border:2px solid var(--line); }
  .choices { display:grid; gap:10px; margin:12px 0 6px; }
  label.opt { display:flex; align-items:center; gap:14px; padding:14px 14px; min-height:64px; border:2px solid var(--line); border-radius:14px; cursor:pointer; background:var(--card); }
  label.opt:hover { border-color:var(--brand); }
  label.opt.sel { border-color:var(--brand); background:var(--brand-soft); }
  label.opt input { flex:none; width:28px; height:28px; margin:0; accent-color:var(--brand); }
  label.opt .nm { font-weight:700; display:block; }
  label.opt .sub { display:block; color:var(--muted); font-size:.93rem; }
  .field { margin:16px 0; }
  .flabel { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.1rem; margin-bottom:8px; }
  .flabel .num { flex:none; width:34px; height:34px; border-radius:50%; background:var(--brand); color:var(--brand-fg); display:inline-flex; align-items:center; justify-content:center; font-size:1rem; }
  select { width:100%; min-height:58px; font:inherit; font-weight:600; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); }
  select:focus-visible { outline:4px solid var(--focus); outline-offset:3px; border-color:var(--brand); }
  [hidden] { display:none !important; }
  ul.plain { list-style:none; padding:0; margin:.3rem 0; }
  ul.plain li { padding:8px 0; border-bottom:1px solid var(--line); }
  ul.plain li:last-child { border-bottom:0; }
  textarea { width:100%; min-height:100px; font:inherit; padding:10px; border:2px solid var(--line); border-radius:12px; background:transparent; color:var(--fg); }
  details { margin:6px 0 10px; }
  summary { cursor:pointer; padding:8px 0; font-weight:600; }
  footer.acct { margin-top:28px; padding-top:12px; border-top:1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { .progress > span { transition:none; } button:active { transform:none; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the voting page</a>
<div id="testbar" role="status" hidden>TEST MODE, this is a practice election, nothing here is real, and no result here counts.</div>
<header class="top">
  <div class="in">
    <p class="org">International Hand Cricket Council</p>
    <h1 id="h1">IHCC Election</h1>
  </div>
</header>
<main id="main" tabindex="-1">
  <div id="msg" role="status" aria-live="polite" tabindex="-1"></div>
  <div id="app"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SB_URL = 'https://krkrpcnovdobnscknfnw.supabase.co';
  var SB_KEY = 'sb_publishable_ZUJcEJgLgksBWY5Y3NUdKQ_xNIvs6t4';
  var sb = supabase.createClient(SB_URL, SB_KEY);
  var app = document.getElementById('app');
  var msgEl = document.getElementById('msg');
  var MODE = 'test';
  try { MODE = localStorage.getItem('ihcc_el_mode') === 'main' ? 'main' : 'test'; } catch (e) {}
  var SESSION = null;
  var CUR = null;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'onclick') n.addEventListener('click', attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function msg(text, isErr, focus) {
    msgEl.textContent = text || '';
    msgEl.className = isErr ? 'err' : '';
    if (focus) msgEl.focus();
  }
  function clearApp() { app.innerHTML = ''; }
  function isTest() { return MODE === 'test'; }
  function T(s) { return (isTest() ? 'TEST: ' : '') + s; }
  function setMode(m) {
    MODE = m;
    try { localStorage.setItem('ihcc_el_mode', m); } catch (e) {}
  }
  function applyChrome() {
    var t = isTest();
    document.getElementById('testbar').hidden = !t;
    document.getElementById('h1').textContent = t ? 'IHCC Election, TEST' : 'IHCC Election';
    document.title = t ? 'TEST, IHCC Election' : 'IHCC Election';
  }
  function errText(e) {
    var m = (e && (e.message || e.error_description)) || 'Something went wrong.';
    return m.replace(/^ERROR:\s*/, '');
  }
  function card(cls) { return el('section', { class: 'card' + (cls ? ' ' + cls : '') }); }

  function renderSignedOut() {
    clearApp();
    document.getElementById('testbar').hidden = true;
    document.getElementById('h1').textContent = 'IHCC Election';
    document.title = 'IHCC Election';
    msg('Please sign in with the Google account, the Gmail, that is on your board squad list.');
    var c = card();
    c.appendChild(el('h2', { text: 'Sign in' }));
    c.appendChild(el('p', { class: 'muted', text: 'The TEST sign in is for practice only. The Main sign in is for the real election, and it opens only when IHCC starts it.' }));
    c.appendChild(el('button', { type: 'button', id: 'btnTest', text: 'TEST Sign in, practice, not real', onclick: function () { signIn('test'); } }));
    c.appendChild(el('button', { type: 'button', id: 'btnMain', class: 'secondary', text: 'Main Sign in, real election', onclick: function () { signIn('main'); } }));
    app.appendChild(c);
  }

  function signIn(mode) {
    setMode(mode);
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } })
      .then(function (r) { if (r.error) msg(errText(r.error), true, true); });
  }
  function signOut() {
    sb.auth.signOut().then(function () { SESSION = null; renderSignedOut(); });
  }

  function accountFooter() {
    return el('footer', { class: 'acct' }, [
      el('p', { class: 'muted small', text: 'Mode, ' + (isTest() ? 'TEST, practice' : 'Main, real') + '.' }),
      el('button', { type: 'button', class: 'secondary', text: isTest() ? 'Switch to Main election, no new sign in' : 'Switch to TEST election, no new sign in',
        onclick: function () { setMode(isTest() ? 'main' : 'test'); load(); } }),
      el('button', { type: 'button', class: 'secondary', text: 'Sign out', onclick: signOut })
    ]);
  }

  async function load(afterMsg) {
    clearApp();
    applyChrome();
    msg('Loading...');
    var r = await sb.rpc('elect_current', { p_test: isTest() });
    if (r.error) { msg(errText(r.error), true, true); return; }
    var d = r.data || {};
    CUR = d;
    if (d.state === 'signed_out') { renderSignedOut(); return; }
    if (d.state === 'test_off') { msg('The TEST election is not available right now.', false, true); app.appendChild(accountFooter()); return; }
    if (d.state === 'none') {
      msg(isTest() ? 'No TEST election is open right now. Please wait for IHCC to tell you.' : 'The election has not started yet. Nothing is open here for now.', false, true);
      app.appendChild(accountFooter());
      return;
    }
    if (d.state === 'not_listed') {
      msg('This Gmail is not on the voting list. Only the first 12 players of each board squad can vote. If you think this is a mistake, please contact IHCC.', true, true);
      app.appendChild(accountFooter());
      return;
    }
    if (d.state !== 'ok') { msg('Unexpected state. Please reload.', true, true); return; }
    await renderElection(d, afterMsg);
  }

  function pktText(iso) { return new Date(iso).toLocaleString('en-GB', { timeZone: 'Asia/Karachi', dateStyle: 'full', timeStyle: 'short' }) + ', Pakistan time'; }
  function localText(iso) {
    var tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (x) {}
    return new Date(iso).toLocaleString('en-GB', { dateStyle: 'full', timeStyle: 'short' }) + (tz ? ', ' + tz : '');
  }
  // Spoken label with commas, so a screen reader pauses between the parts.
  function fmtVoteTime(iso) {
    try {
      var d = new Date(iso);
      var o = { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' };
      var local = d.toLocaleString('en-GB', o);
      var pk = d.toLocaleString('en-GB', Object.assign({ timeZone: 'Asia/Karachi' }, o));
      return local === pk ? local + ' Pakistan time' : local + ' your time, ' + pk + ' Pakistan time';
    } catch (e) { return String(iso); }
  }
  function candLabel(c) {
    var parts = [c.display_name];
    if (c.real_name) parts.push(c.real_name);
    if (c.board) parts.push(c.board);
    return parts.join(', ');
  }

  function identityCard(v) {
    var email = (SESSION && SESSION.user && SESSION.user.email) || '';
    var c = card();
    c.appendChild(el('h2', { text: 'You are voting as' }));
    var dl = el('dl', { class: 'who' });
    [['Display name', v.display_name], ['Real name', v.real_name], ['Board', v.board], ['Gmail', email]].forEach(function (p) {
      dl.appendChild(el('div', null, [el('dt', { text: p[0] }), el('dd', { text: p[1] || '-' })]));
    });
    c.appendChild(dl);
    return c;
  }

  function scheduleCard(e) {
    if (!(e.voting_starts_at && e.voting_ends_at)) return null;
    var c = card();
    c.appendChild(el('h2', { text: 'Voting time' }));
    c.appendChild(el('p', { text: 'Opens, ' + pktText(e.voting_starts_at) + '.' }));
    c.appendChild(el('p', { text: 'Closes, ' + pktText(e.voting_ends_at) + '.' }));
    c.appendChild(el('p', { class: 'muted small', text: 'In your own time, opens ' + localText(e.voting_starts_at) + ', closes ' + localText(e.voting_ends_at) + '. The page opens and closes by itself.' }));
    if (e.paused) c.appendChild(el('p', { text: 'Voting is paused by IHCC for now. Please wait for the announcement in the Main Group.' }));
    return c;
  }

  async function renderElection(d, afterMsg) {
    var e = d.election, v = d.voter || {};
    var both = await Promise.all([
      sb.rpc('elect_ballot', { p_election: e.id }),
      sb.rpc('elect_results', { p_election: e.id })
    ]);
    if (both[0].error) { msg(errText(both[0].error), true, true); return; }
    var ballot = both[0].data;
    var res = both[1].error ? null : both[1].data;

    app.appendChild(el('h2', { text: (isTest() ? 'TEST, ' : '') + e.title, style: 'margin-top:8px' }));
    app.appendChild(identityCard(v));
    var sc = scheduleCard(e);
    if (sc) app.appendChild(sc);

    var status = e.status;
    if (status === 'nominations') {
      msg(T('Voting has not started yet. These are the candidates so far.'), false, true);
      renderCandidatesOnly(ballot);
    } else if (status === 'voting') {
      var info = res && res.stage === 'voting' ? (res.voted_count + ' of ' + res.total_voters + ' voting members have voted so far. ') : '';
      msg(afterMsg || T('Voting is open. ' + info + 'Your vote is final, once you submit it, it cannot be changed.'), false, true);
      renderBallot(e, ballot);
    } else if (status === 'stage1') {
      msg(T('Voting is closed. This is stage one, only the names of people who voted are shown, not who they voted for.'), false, true);
      renderStage1(e, res);
    } else if (status === 'closed') {
      msg(T('The election is closed. These are the results.'), false, true);
      renderClosed(res);
    }
    app.appendChild(accountFooter());
  }

  function renderCandidatesOnly(ballot) {
    (ballot.seats || []).forEach(function (s, idx) {
      var c = card('seat');
      c.appendChild(el('h2', null, [el('span', { class: 'num', 'aria-hidden': 'true', text: String(idx + 1) }), s.seat]));
      if (!s.candidates.length) { c.appendChild(el('p', { class: 'muted', text: 'No candidate yet.' })); app.appendChild(c); return; }
      var ul = el('ul', { class: 'plain' });
      s.candidates.forEach(function (x) { ul.appendChild(el('li', { text: candLabel(x) })); });
      c.appendChild(ul);
      if (s.unopposed) c.appendChild(el('p', { class: 'muted', text: 'Only one candidate so far for this seat.' }));
      app.appendChild(c);
    });
  }

  function renderBallot(e, ballot) {
    var seats = ballot.seats || [];
    var contested = seats.filter(function (s) { return s.candidates.length > 1; });
    var pending = contested.filter(function (s) { return !s.my_vote && !s.my_vote_cancelled; });
    if (contested.length) {
      var done = contested.filter(function (s) { return s.my_vote; });
      var left = pending.length;
      var pc = card();
      pc.appendChild(el('h2', { text: 'My votes' }));
      pc.appendChild(el('p', { id: 'prog', text: 'You have voted for ' + done.length + ' of ' + contested.length + ' seats' + (left ? ', ' + left + ' remaining.' : '. All done, thank you.') }));
      pc.appendChild(el('div', { class: 'progress', 'aria-hidden': 'true' }, [el('span', { style: 'width:' + Math.round(100 * done.length / contested.length) + '%' })]));
      var sum = el('ul', { class: 'plain' });
      contested.forEach(function (s) {
        var mine = s.my_vote ? s.candidates.filter(function (c) { return c.id === s.my_vote; })[0] : null;
        sum.appendChild(el('li', { text: s.seat + ', ' + (mine ? 'you voted for ' + candLabel(mine) + (s.my_vote_at ? ', on ' + fmtVoteTime(s.my_vote_at) : '') : (s.my_vote_cancelled ? 'your vote was cancelled by the Election Committee' : 'not voted yet')) }));
      });
      pc.appendChild(sum);
      app.appendChild(pc);
    }

    var ballotCard = null, reviewCard = null, selects = [];
    if (pending.length) {
      ballotCard = card('ballot');
      ballotCard.appendChild(el('h2', { id: 'ballotH', tabindex: '-1', text: 'Your ballot' }));
      ballotCard.appendChild(el('p', { class: 'muted', text: 'Choose one candidate for every seat below, then press Review. You will see all your choices once more before the final submit. Your votes are final and cannot be changed.' }));
      pending.forEach(function (s, i) {
        var sid = 'sel' + i;
        var f = el('div', { class: 'field' });
        f.appendChild(el('label', { for: sid, class: 'flabel' }, [el('span', { class: 'num', 'aria-hidden': 'true', text: String(i + 1) }), el('span', { text: s.seat })]));
        var sel = el('select', { id: sid, 'aria-required': 'true' });
        sel.appendChild(el('option', { value: '', text: 'Choose a candidate' }));
        s.candidates.forEach(function (c) { sel.appendChild(el('option', { value: c.id, text: candLabel(c) })); });
        f.appendChild(sel);
        ballotCard.appendChild(f);
        selects.push({ seat: s, sel: sel });
      });
      var reviewBtn = el('button', { type: 'button', id: 'btnReview', text: 'Review my votes', onclick: function () {
        var missing = selects.filter(function (x) { return !x.sel.value; });
        if (missing.length) {
          msg('Please choose a candidate for every seat. Still missing, ' + missing.map(function (x) { return x.seat.seat; }).join(', ') + '.', true, true);
          missing[0].sel.focus();
          return;
        }
        var list = reviewCard.querySelector('ul');
        list.innerHTML = '';
        selects.forEach(function (x) {
          var c = x.seat.candidates.filter(function (k) { return k.id === x.sel.value; })[0];
          list.appendChild(el('li', null, [el('strong', { text: x.seat.seat }), el('span', { text: ', ' + candLabel(c) })]));
        });
        ballotCard.hidden = true;
        reviewCard.hidden = false;
        msg(T('Please check your choices. Nothing is submitted yet.'));
        document.getElementById('reviewH').focus();
      } });
      ballotCard.appendChild(reviewBtn);
      app.appendChild(ballotCard);

      reviewCard = card('ballot');
      reviewCard.hidden = true;
      reviewCard.appendChild(el('h2', { id: 'reviewH', tabindex: '-1', text: 'Review your votes' }));
      reviewCard.appendChild(el('p', { class: 'muted', text: 'These are your choices. After the final submit, they cannot be changed.' }));
      reviewCard.appendChild(el('ul', { class: 'plain' }));
      var back = el('button', { type: 'button', class: 'secondary', text: 'Go back and change', onclick: function () {
        reviewCard.hidden = true;
        ballotCard.hidden = false;
        msg(T('You can change your choices. Nothing is submitted yet.'));
        selects[0].sel.focus();
      } });
      var fin = el('button', { type: 'button', id: 'btnFinal', text: T('Final submit, cannot be changed'), onclick: async function () {
        if (!window.confirm(T('Last check. Submit your FINAL votes for all seats? They cannot be changed after this.'))) return;
        fin.disabled = true; back.disabled = true;
        msg('Submitting...');
        var choices = selects.map(function (x) { return { seat: x.seat.seat, candidate: x.sel.value }; });
        var r = await sb.rpc('elect_cast_ballot', { p_election: e.id, p_choices: choices });
        if (r.error) {
          fin.disabled = false; back.disabled = false;
          msg(errText(r.error) + ' If you are not sure, reload the page to see whether your votes were saved.', true, true);
          return;
        }
        await load(T('All your votes are submitted. Thank you. A vote cannot be changed.'));
      } });
      reviewCard.appendChild(back);
      reviewCard.appendChild(fin);
      app.appendChild(reviewCard);
    }

    seats.forEach(function (s, idx) {
      var already = s.my_vote || s.my_vote_cancelled || s.unopposed || !s.candidates.length;
      if (!already) return;
      var c = card('seat');
      var h = el('h2', null, [el('span', { class: 'num', 'aria-hidden': 'true', text: String(idx + 1) }), s.seat]);
      c.appendChild(h);
      if (!s.candidates.length) {
        c.appendChild(el('p', { class: 'muted', text: 'No candidate for this seat. Nothing to vote on.' }));
      } else if (s.unopposed) {
        c.appendChild(el('p', { text: candLabel(s.candidates[0]) + ', is the only candidate and is elected without a contest. No vote is needed.' }));
      } else if (s.my_vote) {
        var mine = s.candidates.filter(function (x) { return x.id === s.my_vote; })[0];
        c.className = 'card seat done';
        h.appendChild(el('span', { class: 'badge', text: 'Voted' }));
        c.appendChild(el('p', { text: 'Your vote for ' + s.seat + ' is submitted, ' + (mine ? candLabel(mine) : '') + (s.my_vote_at ? ', on ' + fmtVoteTime(s.my_vote_at) : '') + '. A vote cannot be changed.' }));
      } else {
        c.className = 'card seat bad';
        c.appendChild(el('p', { text: 'Your vote for ' + s.seat + ' was cancelled by the Election Committee. Please contact the Committee.' }));
      }
      app.appendChild(c);
    });
    app.appendChild(el('p', { class: 'muted small', text: 'Voting is open, not secret. After the election, the list of who voted for whom is published.' }));
  }

  function renderStage1(e, res) {
    var c = card();
    c.appendChild(el('h2', { text: 'Who has voted' }));
    if (res && res.voted) {
      c.appendChild(el('p', { text: res.voted.length + ' of ' + res.total_voters + ' voting members voted.' }));
      var ul = el('ul', { class: 'plain' });
      res.voted.forEach(function (x) { ul.appendChild(el('li', { text: x.name + ', ' + x.board })); });
      c.appendChild(ul);
    }
    app.appendChild(c);
    var c2 = card();
    c2.appendChild(el('h2', { text: 'A vote under my name was not mine' }));
    c2.appendChild(el('p', { class: 'muted', text: 'If your name is on this list but you did not vote, tell the Election Committee here within 24 hours.' }));
    var ta = el('textarea', { id: 'objNote', 'aria-label': 'Your message to the Election Committee', maxlength: '500' });
    c2.appendChild(ta);
    c2.appendChild(el('button', { type: 'button', text: T('Send my report'), onclick: async function () {
      var note = ta.value.trim();
      if (!note) { msg('Please write a short message first.', true, true); return; }
      var r = await sb.rpc('elect_object', { p_election: e.id, p_note: note });
      if (r.error) { msg(errText(r.error), true, true); return; }
      ta.value = '';
      msg(T('Your report was sent to the Election Committee.'), false, true);
    } }));
    app.appendChild(c2);
  }

  function renderClosed(res) {
    if (!res || res.stage !== 'closed') { var c0 = card(); c0.appendChild(el('p', { text: 'Results are not available.' })); app.appendChild(c0); return; }
    (res.seats || []).forEach(function (s, idx) {
      var c = card('seat');
      c.appendChild(el('h2', null, [el('span', { class: 'num', 'aria-hidden': 'true', text: String(idx + 1) }), s.seat]));
      if (!s.candidates.length) { c.appendChild(el('p', { class: 'muted', text: 'No candidate.' })); app.appendChild(c); return; }
      if (s.unopposed) {
        c.appendChild(el('p', { text: s.candidates[0].display_name + ', ' + s.candidates[0].board + ', was elected without a contest.' }));
        app.appendChild(c); return;
      }
      var ul = el('ul', { class: 'plain' });
      s.candidates.forEach(function (x, i) {
        var li = el('li');
        li.appendChild(el('strong', { text: (i === 0 ? 'Most votes, ' : '') + x.display_name + ', ' + x.board + ', ' + x.votes + ' votes' }));
        var det = el('details');
        det.appendChild(el('summary', { text: 'See who voted for ' + x.display_name }));
        var inner = el('ul', { class: 'plain' });
        (x.voters || []).forEach(function (y) { inner.appendChild(el('li', { text: y.name + ', ' + y.board })); });
        det.appendChild(inner);
        li.appendChild(det);
        ul.appendChild(li);
      });
      c.appendChild(ul);
      app.appendChild(c);
    });
  }

  setInterval(async function () {
    if (!SESSION || !CUR || !CUR.election) return;
    try {
      var r = await sb.rpc('elect_current', { p_test: isTest() });
      if (r.error || !r.data || !r.data.election) return;
      var n = r.data.election, o = CUR.election;
      if (n.status !== o.status || !!n.paused !== !!o.paused || n.id !== o.id) { load(); }
    } catch (x) {}
  }, 30000);
  sb.auth.onAuthStateChange(function (ev, sess) { SESSION = sess; });
  sb.auth.getSession().then(function (r) {
    SESSION = r.data && r.data.session;
    if (!SESSION) renderSignedOut(); else load();
  });
})();
</script>
</body>
</html>
